<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D0F12">
  <title>NaviGO Share trip</title>
  <link rel="icon" href="/icon.svg">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
      background: #0D0F12; color: #EEEEEE; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .box { background: #171A1F; border: 1px solid #2C3038; border-radius: 14px; padding: 26px; max-width: 380px; }
    h1 { font-size: 20px; margin: 10px 0 6px; }
    p { color: #9AA4B2; margin: 0; }
    b { color: #3B9EFF; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icon.svg" width="56" height="56" alt="">
    <h1>NaviGO <b>Share trip</b></h1>
    <p>Open the trip link someone sent you to watch their drive live: the map, their route, when they'll arrive and where they are now.</p>
  </div>
</body>
</html>
