<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0F12">
  <title>Live trip</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css">
  <style>
    :root {
      --bg: #0D0F12; --panel: #171A1F; --alt: #23262C; --border: #2C3038;
      --accent: #3B9EFF; --danger: #FF4D4D; --green: #4CAF50; --warn: #FFB020;
      --text: #EEEEEE; --muted: #9AA4B2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; background: #272E3A; }
    /* Street View of where they are, facing the way they're going: the bottom quarter of the screen */
    #sv { position: fixed; left: 0; right: 0; bottom: 0; height: 25vh; z-index: 999; display: none; background: #000; border-top: 2px solid #2C3038; }
    #sv iframe { width: 100%; height: 100%; border: 0; display: block; }
    body.sv #sv { display: block; }
    body.sv #map { bottom: 25vh; }
    body.sv #follow { bottom: calc(25vh + 22px); } body.sv #brand { bottom: calc(25vh + 26px); }
    .mapboxgl-ctrl-attrib, .maplibregl-ctrl-attrib { background: rgba(13,15,18,.7) !important; }
    .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }

    #card { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); max-width: 480px; margin: 0 auto;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .box { background: rgba(23,26,31,.94); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    #liveBox { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); padding: 9px 14px; }
    #placeBox:empty, #placeBox.empty { display: none; }
    /* what they're doing: icon + Driving / Not moving */
    #doing { display: flex; align-items: center; gap: 12px; }
    #actIcon { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--alt); display: flex; align-items: center; justify-content: center; }
    #actIcon svg { width: 28px; height: 28px; }
    #actIcon.driving { background: rgba(59,158,255,.18); }
    #actText { font-size: 17px; font-weight: 700; }
    #actSub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; }
    #who { font-weight: 600; color: var(--text); }
    #moodTag { font-size: 13px; color: var(--muted); font-weight: 500; }
    #to { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #to b { color: var(--text); font-weight: 600; }
    #where { color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #where:empty { display: none; }
    #where .pin { color: var(--accent); }
    /* what they're listening to, in the card */
    #song { display: none; align-items: flex-start; gap: 7px; margin-top: 10px; font-size: 13px; min-width: 0; }
    #song.show { display: flex; }
    #song .tag { flex: none; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; background: var(--alt); }
    #song .tag.spotify { background: #1DB954; color: #000; }
    #song .tag.youtube { background: #FF0033; color: #fff; }
    #song .tag.radio, .np .tag.radio { background: #E9EDF3; color: #111; }
    #song img.logo, .np img.logo { flex: none; width: 22px; height: 22px; border-radius: 5px; background: #fff; object-fit: contain; }
    #song .st { flex: none; font-size: 11px; color: var(--green); }
    #song .st.paused { color: var(--muted); }
    #song .txt { white-space: normal; overflow-wrap: anywhere; min-width: 0; line-height: 1.3; }
    #song .tag, #song .st { margin-top: 1px; }
    #song .time { flex: none; margin-left: auto; padding-left: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    #listenBtn { display: none; margin-top: 9px; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    #listenBtn.show { display: block; }
    #listenBtn.on { background: var(--alt); color: var(--text); }
    #listenNote { display: none; margin-top: 5px; font-size: 12px; color: var(--muted); }
    #listenNote.show { display: block; }
    #songBar { display: none; height: 3px; margin-top: 5px; background: #2F343C; border-radius: 2px; overflow: hidden; }
    #songBar.show { display: block; }
    #songBar > div { height: 100%; width: 0; background: #1DB954; }
    #songBar.youtube > div { background: #FF0033; }
    .np .time { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .stat { background: var(--alt); border-radius: 10px; padding: 7px 10px; }
    .stat .v { font-size: 18px; font-weight: 700; }
    .stat .l { font-size: 12px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .dot.stale { background: var(--warn); }
    .dot.lost { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .45; } }
    /* trip progress: blue start flag, blue bar with a little car moving along it, chequered finish flag */
    #progress { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    #progress .flagIc { flex: none; width: 18px; height: 22px; }
    #progress .track { position: relative; flex: 1; height: 6px; background: #2F343C; border-radius: 3px; }
    #progress .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 3px; transition: width .6s; }
    #progress .car { position: absolute; top: 50%; left: 0; width: 26px; height: 16px; transform: translate(-50%, -50%); transition: left .6s;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

    #follow { position: fixed; right: 14px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 1000;
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: rgba(23,26,31,.94);
      color: var(--text); font-size: 22px; box-shadow: 0 6px 16px rgba(0,0,0,.45); cursor: pointer; }
    #follow.on { color: var(--accent); border-color: var(--accent); }
    /* their speed: the same round dial as the app's (dark, dotted ring, big number, mph) */
    #speedo { position: fixed; left: 14px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 1000; width: 76px; height: 76px; border-radius: 50%;
      background: rgba(26,29,35,.9); box-shadow: 0 4px 10px rgba(0,0,0,.5); display: none; flex-direction: column; align-items: center; justify-content: center; color: #EEE; }
    #speedo.show { display: flex; }
    #speedo svg { position: absolute; inset: 0; }
    #speedo b { font: 700 28px/1 system-ui, sans-serif; } #speedo i { font: 400 11px/1 system-ui, sans-serif; font-style: normal; opacity: .8; margin-top: 2px; }
    body.sv #speedo { bottom: calc(25vh + 64px); }
    #brand { position: fixed; left: 14px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 1000;
      font-size: 12px; color: var(--muted); background: rgba(23,26,31,.85); padding: 5px 10px; border-radius: 20px; }
    #brand b { color: var(--accent); }

    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    #msg.show { display: flex; }
    #msg .box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; max-width: 360px; text-align: center; }
    #msg h2 { margin: 6px 0; font-size: 19px; }
    #msg p { margin: 0; color: var(--muted); }

    /* the person on the map: mood emoji or photo in a ring, with a little blue arrow showing their direction */
    .me { position: relative; width: 56px; height: 56px; }
    .me .face { position: absolute; inset: 6px; border-radius: 50%; background: #1D2127; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.6); }
    .me .face img { width: 100%; height: 100%; object-fit: cover; }
    .me .arrow { position: absolute; inset: 0; transition: transform .8s; }
    .me .arrow::before { content: ""; position: absolute; left: 50%; top: -5px; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 11px solid var(--accent);
      filter: drop-shadow(0 0 1.5px #fff); }
    .me.old .face { filter: grayscale(.8); opacity: .75; }
    /* a little car under the face */
    /* "Live · updated just now": a small tag above their name, just big enough for the words */
    .me .live { position: absolute; left: 50%; top: -48px; transform: translateX(-50%); display: none; align-items: center; gap: 5px;
      white-space: nowrap; pointer-events: none; padding: 2px 8px; border-radius: 10px; background: rgba(23,26,31,.94); border: 1px solid var(--border);
      font: 600 11px/15px system-ui, sans-serif; color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .me .live.show { display: flex; }
    /* headphones over the picture while music or the radio is playing (static, like they're wearing them) */
    .me .note { position: absolute; left: -2px; top: -4px; width: 60px; height: 50px; display: none; pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
    .me .note.show { display: block; }
    .me .live .dot { width: 7px; height: 7px; }
    .me .mode { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); }   /* just the icon, no circle, as big as the face (Nick) */
    .me .mode:empty { display: none; }
    /* now playing, above the icon */
    .np { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
      width: max-content; max-width: min(340px, 80vw); padding: 4px 9px 4px 5px; border-radius: 14px; background: rgba(23,26,31,.95); border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(0,0,0,.5); font-size: 12px; color: var(--text); pointer-events: none; }
    .np.show { display: flex; }
    .np .tag { flex: none; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
    .np .tag.spotify { background: #1DB954; color: #000; }
    .np .tag.youtube { background: #FF0033; color: #fff; }
    .np .st { flex: none; font-size: 10px; color: var(--green); }
    .np .st.paused { color: var(--muted); }
    .np .txt { white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
    /* their first name just above the face (Nick) */
    .me .nm { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      font: 800 13px/16px system-ui, sans-serif; color: #fff; text-shadow: 0 0 3px #000, 0 1px 3px #000, 0 0 6px rgba(0,0,0,.8); }
    .me .nm:empty { display: none; }
    .me.named .np { bottom: 104px; }
    .secT { font-size: 13px; color: var(--muted); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .secT b { color: var(--text); font-weight: 600; }
    #stopSec { display: none; }
    .stopPin { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid #3B9EFF; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .me .face { cursor: pointer; }
    /* "Message Nick": button, sheet with ready-made messages and emotes, and the replies coming back */
    #msgBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 1000; display: none;
      border: 0; border-radius: 999px; background: #33CCFF; color: #0D1B2A; font: 700 16px system-ui, sans-serif; padding: 13px 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,.45); cursor: pointer; }
    body.sv #msgBtn { bottom: calc(25vh + 22px); }
    #msgSheet { position: fixed; inset: 0; z-index: 2500; display: none; background: rgba(0,0,0,.55); }
    #msgSheet.show { display: block; }
    #msgSheet .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--panel);
      border-radius: 22px 22px 0 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
    #msgSheet .handle { width: 40px; height: 4px; border-radius: 2px; background: #555; margin: 0 auto 12px; }
    #msgSheet h3 { margin: 0 0 10px; font-size: 19px; }
    #msgSheet input { width: 100%; background: var(--alt); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
      font: 16px system-ui, sans-serif; padding: 12px 14px; outline: none; }
    #msgSheet .lbl { color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
    #msgSheet .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    #msgSheet .chip { border: 1px solid var(--border); background: var(--alt); color: var(--text); border-radius: 999px; padding: 9px 14px;
      font: 600 14px system-ui, sans-serif; cursor: pointer; }
    #msgSheet .emo { font-size: 28px; padding: 6px 10px; }
    #msgSheet .row { display: flex; gap: 8px; margin-top: 8px; }
    #msgSheet .send { flex: none; border: 0; border-radius: 12px; background: #33CCFF; color: #0D1B2A; font: 700 16px system-ui, sans-serif; padding: 0 18px; cursor: pointer; }
    #saveAsk { position: fixed; left: 0; right: 0; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 2600; display: none; padding: 0 16px; }
    #saveAsk.show { display: block; }
    #saveAsk .box { max-width: 420px; margin: 0 auto; background: var(--panel); border: 1.5px solid #33CCFF; border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    #saveAsk .q { color: var(--muted); margin: 4px 0 12px; overflow-wrap: anywhere; }
    #saveAsk .row { display: flex; gap: 10px; }
    #saveAsk button { flex: 1; border: 0; border-radius: 999px; padding: 11px; font: 700 15px system-ui, sans-serif; cursor: pointer; background: var(--alt); color: #33CCFF; }
    #saveAsk #saveYes { background: #33CCFF; color: #0D1B2A; }
    #replyToast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -150%); z-index: 3000;
      background: var(--panel); border: 1.5px solid #33CCFF; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: transform .35s; white-space: nowrap; }
    #replyToast.show { transform: translate(-50%, 0); }
    .burst { position: fixed; left: 50%; bottom: 20vh; z-index: 3000; font-size: 110px; transform: translateX(-50%); pointer-events: none;
      animation: burst 3s ease-out forwards; }
    @keyframes burst { 0% { opacity: 0; transform: translate(-50%, 40px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -45vh) scale(1.1); } }
    .flag { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sv"></div>

  <div id="card">
    <!-- 1. live: when the location last came in, and the speed -->
    <div class="box" id="liveBox"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
    <!-- 2. where they are now (and where they're going) -->
    <div class="box" id="placeBox">
      <div id="where"></div>
      <div id="to"></div>
      <div id="stopSec">
        <div class="secT">Next stop · <b id="stopName"></b></div>
        <div class="stats">
          <div class="stat"><div class="v" id="sArrive">--:--</div><div class="l">Arrival</div></div>
          <div class="stat"><div class="v" id="sLeft">--</div><div class="l">Time left</div></div>
          <div class="stat"><div class="v" id="sDist">--</div><div class="l">Distance</div></div>
        </div>
        <div class="secT">Final destination · <b id="finalName"></b></div>
      </div>
      <div class="stats" id="stats">
        <div class="stat"><div class="v" id="arrive">--:--</div><div class="l">Arrival</div></div>
        <div class="stat"><div class="v" id="left">--</div><div class="l">Time left</div></div>
        <div class="stat"><div class="v" id="dist">--</div><div class="l">Distance</div></div>
      </div>
      <div id="progress">
        <svg class="flagIc" viewBox="0 0 18 22" aria-label="Start"><line x1="3" y1="2" x2="3" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5c4-1.6 8 1.6 12 .3v8.4c-4 1.4-8-1.8-12-.2Z" fill="#3B9EFF"/></svg>
        <div class="track"><div class="fill"></div>
          <svg class="car" viewBox="0 0 26 16" aria-label="Car"><rect x="1" y="2" width="24" height="12" rx="4" fill="#C3C9D1" stroke="#fff" stroke-width="1.5"/><rect x="14" y="4" width="5" height="8" rx="1.5" fill="#4A5563"/><rect x="4" y="4.5" width="4" height="7" rx="1.2" fill="#6B7684"/><circle cx="23.5" cy="4.5" r="1" fill="#FFF59D"/><circle cx="23.5" cy="11.5" r="1" fill="#FFF59D"/></svg>
        </div>
        <svg class="flagIc" viewBox="0 0 18 22" aria-label="Finish"><defs><pattern id="chq" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#111"/><rect x="2" y="2" width="2" height="2" fill="#111"/></pattern></defs><line x1="3" y1="2" x2="3" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5h12.5v8.5H4Z" fill="url(#chq)" stroke="#fff" stroke-width=".8"/></svg>
      </div>
    </div>
    <!-- 3. what they're doing: Driving / Not moving, and what they're listening to -->
    <div class="box" id="doingBox">
      <div id="doing">
        <div id="actIcon"></div>
        <div style="flex:1;min-width:0"><div id="actText">Loading…</div><div id="actSub"><span id="who"></span> <span id="moodTag"></span></div></div>
      </div>
      <div id="song"><span class="tag"></span><span class="st"></span><span class="txt"></span><span class="time"></span></div>
      <div id="songBar"><div></div></div>
      <button id="listenBtn" type="button">🎧 Listen along</button>
      <div id="listenNote"></div>
      <audio id="listenAudio" preload="none"></audio>
    </div>
  </div>

  <button id="msgBtn">💬 Message</button>
  <div id="msgSheet"><div class="sheet">
    <div class="handle"></div>
    <h3 id="msgTitle2">Send a message</h3>
    <div class="lbl">Quick messages</div>
    <div class="chips" id="msgQuick"></div>
    <div class="lbl">Emotes</div>
    <div class="chips" id="msgEmotes"></div>
    <div class="lbl">Or write your own</div>
    <div class="row"><input id="msgText" maxlength="140" placeholder="Type a message"><button class="send" id="msgSend">Send</button></div>
  </div></div>
  <div id="saveAsk"><div class="box"><div style="font-weight:700;font-size:17px">Save as quick message?</div><div class="q"></div>
    <div class="row"><button id="saveNo">No thanks</button><button id="saveYes">Save</button></div></div></div>
  <div id="replyToast"></div>
  <button id="follow" class="on" title="Follow">◎</button>
  <div id="brand">Shared from <b>NaviGO</b></div>
  <div id="speedo"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="34.5" fill="none" stroke="rgba(238,238,238,.6)" stroke-width="2" stroke-dasharray="4 6"/></svg><b>0</b><i>mph</i></div>

  <div id="msg"><div class="box"><div style="font-size:36px" id="msgIcon">🔗</div><h2 id="msgTitle"></h2><p id="msgText"></p></div></div>

  <script src="/config.js"></script>
  <script>
  // TomTom map (same as the NaviGO app) when the server has a TomTom key, otherwise the Mapbox one
  window.USE_TOMTOM = !!window.TOMTOM_KEY;
  document.write(window.USE_TOMTOM
    ? '<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>'
    : '<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"><\/script>');
  </script>
  <script src="/td-map.js"></script>
  <script>
  'use strict';
  const id = location.pathname.split('/').filter(Boolean)[1];
  const MOODS = { '😀': 'Happy', '😢': 'Sad', '🤩': 'Excited', '😬': 'Nervous', '😠': 'Angry', '😎': "Vibin'",
    '😴': 'Tired', '🥳': 'Celebrating', '🤔': 'Thinking', '😌': 'Chilled', '🤬': 'Raging', '🥶': 'Freezing' };
  const $ = s => document.getElementById(s);

  // The same Mapbox map as the NaviGO app, in Truck Dash colours (td-map.js)
  // TomTom's Orbis map in night colours with live traffic flow on the roads (the same map the app shows)
  const gl = window.USE_TOMTOM ? window.maplibregl : window.mapboxgl;
  const TT_STYLE = 'https://api.tomtom.com/maps/orbis/assets/styles/0.*/style.json?apiVersion=1&map=basic_street-dark&trafficFlow=flow_relative-dark&key='
    + encodeURIComponent(window.TOMTOM_KEY || '');
  if (!window.USE_TOMTOM) mapboxgl.accessToken = window.MAPBOX_TOKEN;
  const map = new gl.Map({ container: 'map', style: window.USE_TOMTOM ? TT_STYLE : 'mapbox://styles/mapbox/dark-v11', center: [-2.63, 53.55], zoom: 11,
    dragRotate: false, pitchWithRotate: false });
  map.touchZoomRotate.disableRotation();
  // Waze-style: zoom in and the map leans into 3D, zoom out and it flattens (flat from town level)

    svAt = p; svHd = hd; svT = now;
    const u = 'https://www.google.com/maps/embed/v1/streetview?key=' + encodeURIComponent(window.GMAPS_KEY) +
      '&location=' + d.lat.toFixed(6) + ',' + d.lng.toFixed(6) + '&heading=' + hd + '&pitch=0&fov=90';
    const box = $('sv'); let f = box.querySelector('iframe');
    if (!f) { f = document.createElement('iframe'); f.loading = 'lazy'; f.referrerPolicy = 'no-referrer-when-downgrade'; f.allowFullscreen = true; box.appendChild(f); }
    f.src = u;
  }
  const metres = (a, b) => { const k = 111320 * Math.cos(a[1] * Math.PI / 180); return Math.hypot((b[0] - a[0]) * k, (b[1] - a[1]) * 111320); };

  // ---------- Send them a message (quick messages, emotes or your own words); the app shows it as a banner ----------
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let viewer = store.get('navigoViewer');
  if (!viewer) { viewer = Math.random().toString(36).slice(2, 14); store.set('navigoViewer', viewer); }
  const QUICK = ['How long you gonna be?', 'I love you ❤️', 'Drive safe', "I'm here", 'Call me when you can', 'Where are you?'];
  const EMOTES = ['❤️', '😘', '👍', '😂', '👋', '🚗', '🎉', '😴'];
  const firstName = () => String((data && data.name) || '').trim().split(/\s+/)[0] || 'them';
  // quick messages: the built-in ones plus any you saved (saved ones have a little × to remove them); one tap sends
  const loadSaved = () => { try { return JSON.parse(store.get('navigoQuick') || '[]'); } catch (e) { return []; } };
  function drawQuick() {
    const box = $('msgQuick'); box.innerHTML = '';
    QUICK.forEach(q => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = q; b.onclick = () => sendMsg(q, false); box.append(b); });
    loadSaved().forEach(q => {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = q; b.onclick = () => sendMsg(q, false);
      const x = document.createElement('span'); x.textContent = '  ×'; x.style.color = 'var(--muted)';
      x.onclick = e => { e.stopPropagation(); store.set('navigoQuick', JSON.stringify(loadSaved().filter(v => v !== q))); drawQuick(); };
      b.append(x); box.append(b);
    });
  }
  drawQuick();
  EMOTES.forEach(e => { const b = document.createElement('button'); b.className = 'chip emo'; b.textContent = e; b.onclick = () => sendMsg(e, true); $('msgEmotes').append(b); });
  $('msgBtn').onclick = () => { $('msgTitle2').textContent = 'Send ' + firstName() + ' a message'; $('msgSheet').classList.add('show'); };
  $('msgSheet').onclick = e => { if (e.target.id === 'msgSheet') $('msgSheet').classList.remove('show'); };
  $('msgSend').onclick = async () => {
    const t = $('msgText').value.trim();
    if (!t) { toast('Type a message first'); $('msgText').focus(); return; }
    if (await sendMsg(t, false) && !QUICK.includes(t) && !loadSaved().includes(t)) askSave(t);
  };
  // after sending your own words: "Save as quick message?"
  function askSave(t) {
    const box = $('saveAsk'); box.querySelector('.q').textContent = '"' + t + '"';
    box.classList.add('show');
    $('saveYes').onclick = () => { store.set('navigoQuick', JSON.stringify(loadSaved().concat([t]).slice(-12))); drawQuick(); box.classList.remove('show'); toast('Saved as a quick message'); };
    $('saveNo').onclick = () => box.classList.remove('show');
  }
  $('msgText').addEventListener('keydown', e => { if (e.key === 'Enter') $('msgSend').onclick(); });
  function toast(text) { const t = $('replyToast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 4000); }
  async function sendMsg(text, emote) {
    const from = 'Nicola';   // Nick: the share page is used by Nicola, so no name box
    try {
      const r = await fetch('/api/share/' + id + '/msg', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ viewer, from, text, emote }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(j.error || "Couldn't send that"); return false; }
      $('msgText').value = ''; $('msgSheet').classList.remove('show');
      toast((emote ? text + ' sent to ' : 'Sent to ') + firstName());
      return true;
    } catch (e) { toast("Couldn't send that. Try again"); return false; }
  }
  // their reply: "seen it" for a message, or the same emote sent back
  function showReply(r) {
    if (r.kind === 'emote' && r.emote) {
      const b = document.createElement('div'); b.className = 'burst'; b.textContent = r.text; document.body.append(b);
      setTimeout(() => b.remove(), 3200);
      toast(firstName() + ' sent ' + r.text + ' back');
    } else toast('✅ ' + firstName() + ' acknowledged your message');
  }

  setInterval(render, 1000);   // keep "updated x seconds ago" ticking
  if (!/^[A-Za-z0-9]{8,16}$/.test(id || '')) showMsg('🔗', 'Bad link', 'This trip link is not complete.');
  else poll();
  </script>
</body>
</html>
