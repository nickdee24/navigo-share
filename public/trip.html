<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0F12">
  <title>Live trip</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css">
  <style>
    :root {
      --bg: #0D0F12; --panel: #171A1F; --alt: #23262C; --border: #2C3038;
      --accent: #3B9EFF; --danger: #FF4D4D; --green: #4CAF50; --warn: #FFB020;
      --text: #EEEEEE; --muted: #9AA4B2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; background: #272E3A; }
    .mapboxgl-ctrl-attrib { background: rgba(13,15,18,.7) !important; }
    .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }

    #card { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); max-width: 480px; margin: 0 auto;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .box { background: rgba(23,26,31,.94); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    #liveBox { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); padding: 9px 14px; }
    #placeBox:empty, #placeBox.empty { display: none; }
    /* what they're doing: icon + Driving / Not moving / On the bus / Walking */
    #doing { display: flex; align-items: center; gap: 12px; }
    #actIcon { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--alt); display: flex; align-items: center; justify-content: center; }
    #actIcon svg { width: 28px; height: 28px; }
    #actIcon.driving { background: rgba(59,158,255,.18); }
    #actIcon.bus { background: rgba(0,169,164,.22); }
    #actIcon.walking { background: rgba(76,175,80,.2); }
    #actText { font-size: 17px; font-weight: 700; }
    #actSub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .svc { display: inline-block; background: #111; color: #FFB020; border: 1px solid #444; border-radius: 6px; padding: 0 6px;
      font-weight: 800; font-size: 14px; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; }
    #who { font-weight: 600; color: var(--text); }
    #moodTag { font-size: 13px; color: var(--muted); font-weight: 500; }
    #to { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #to b { color: var(--text); font-weight: 600; }
    #where { color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #where:empty { display: none; }
    #where .pin { color: var(--accent); }
    /* what they're listening to, in the card */
    #song { display: none; align-items: flex-start; gap: 7px; margin-top: 10px; font-size: 13px; min-width: 0; }
    #song.show { display: flex; }
    #song .tag { flex: none; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; background: var(--alt); }
    #song .tag.spotify { background: #1DB954; color: #000; }
    #song .tag.youtube { background: #FF0033; color: #fff; }
    #song .tag.radio, .np .tag.radio { background: #E9EDF3; color: #111; }
    #song img.logo, .np img.logo { flex: none; width: 22px; height: 22px; border-radius: 5px; background: #fff; object-fit: contain; }
    #song .st { flex: none; font-size: 11px; color: var(--green); }
    #song .st.paused { color: var(--muted); }
    #song .txt { white-space: normal; overflow-wrap: anywhere; min-width: 0; line-height: 1.3; }
    #song .tag, #song .st { margin-top: 1px; }
    #song .time { flex: none; margin-left: auto; padding-left: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    #songBar { display: none; height: 3px; margin-top: 5px; background: #2F343C; border-radius: 2px; overflow: hidden; }
    #songBar.show { display: block; }
    #songBar > div { height: 100%; width: 0; background: #1DB954; }
    #songBar.youtube > div { background: #FF0033; }
    .np .time { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .stat { background: var(--alt); border-radius: 10px; padding: 7px 10px; }
    .stat .v { font-size: 18px; font-weight: 700; }
    .stat .l { font-size: 12px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .dot.stale { background: var(--warn); }
    .dot.lost { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .45; } }
    /* trip progress: blue start flag, blue bar with a little car moving along it, chequered finish flag */
    #progress { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    #progress .flagIc { flex: none; width: 18px; height: 22px; }
    #progress .track { position: relative; flex: 1; height: 6px; background: #2F343C; border-radius: 3px; }
    #progress .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 3px; transition: width .6s; }
    #progress .car { position: absolute; top: 50%; left: 0; width: 26px; height: 16px; transform: translate(-50%, -50%); transition: left .6s;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

    #follow { position: fixed; right: 14px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 1000;
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: rgba(23,26,31,.94);
      color: var(--text); font-size: 22px; box-shadow: 0 6px 16px rgba(0,0,0,.45); cursor: pointer; }
    #follow.on { color: var(--accent); border-color: var(--accent); }
    /* live buses on/off, above the follow button */
    #busesBtn { position: fixed; right: 14px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 1000;
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: rgba(23,26,31,.94);
      color: var(--muted); box-shadow: 0 6px 16px rgba(0,0,0,.45); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    #busesBtn.on { color: #00C2BB; border-color: #00C2BB; }
    #busesBtn svg { width: 26px; height: 26px; }
    #busesTip { position: fixed; right: 72px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 1000; font-size: 12px; color: var(--text);
      background: rgba(23,26,31,.94); border: 1px solid var(--border); border-radius: 10px; padding: 5px 9px; display: none; }
    .lbus { position: relative; width: 16px; height: 36px; pointer-events: auto; cursor: pointer; }
    .lbus img { position: absolute; left: 3px; top: 0; width: 10px; height: 36px; transition: transform .8s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    .lbus svg { position: absolute; inset: 0; transition: transform .8s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    .lbus b { position: absolute; left: 50%; bottom: calc(50% + var(--lift, 22px)); transform: translate(-50%, var(--dy, 0px)); transition: transform .3s; font: 800 11px ui-monospace, Menlo, monospace; color: #FFB020;
      background: #111; border-radius: 4px; padding: 0 3px; white-space: nowrap; }
    #brand { position: fixed; left: 14px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 1000;
      font-size: 12px; color: var(--muted); background: rgba(23,26,31,.85); padding: 5px 10px; border-radius: 20px; }
    #brand b { color: var(--accent); }

    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    #msg.show { display: flex; }
    #msg .box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; max-width: 360px; text-align: center; }
    #msg h2 { margin: 6px 0; font-size: 19px; }
    #msg p { margin: 0; color: var(--muted); }

    /* the person on the map: mood emoji or photo in a ring, with a little blue arrow showing their direction */
    .me { position: relative; width: 56px; height: 56px; }
    .me .face { position: absolute; inset: 6px; border-radius: 50%; background: #1D2127; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.6); }
    .me .face img { width: 100%; height: 100%; object-fit: cover; }
    .me .arrow { position: absolute; inset: 0; transition: transform .8s; }
    .me .arrow::before { content: ""; position: absolute; left: 50%; top: -5px; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 11px solid var(--accent);
      filter: drop-shadow(0 0 1.5px #fff); }
    .me.old .face { filter: grayscale(.8); opacity: .75; }
    /* now playing, above the icon */
    .np { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
      width: max-content; max-width: min(340px, 80vw); padding: 4px 9px 4px 5px; border-radius: 14px; background: rgba(23,26,31,.95); border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(0,0,0,.5); font-size: 12px; color: var(--text); pointer-events: none; }
    .np.show { display: flex; }
    .np .tag { flex: none; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
    .np .tag.spotify { background: #1DB954; color: #000; }
    .np .tag.youtube { background: #FF0033; color: #fff; }
    .np .st { flex: none; font-size: 10px; color: var(--green); }
    .np .st.paused { color: var(--muted); }
    .np .txt { white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
    @font-face { font-family: '7LED'; src: url('/7LED.ttf') format('truetype'); font-display: swap; }
    /* the bus sign: like the orange LED display on the front of a bus (Nick's 7LED font, little-dots look), then a separate
       banner under it like the app's "Pick your bus" pill: "Stop 4 of 18  16:29" with a red +minutes when late */
    .me .busSign { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); display: none; white-space: nowrap; text-align: center; }
    .me .busSign.show { display: block; cursor: pointer; pointer-events: auto; }
    .me .busSign .l1 { position: relative; display: inline-block; vertical-align: top; background: #111; color: #111; border: 2px solid #fff; border-radius: 7px;
      padding: 2px 8px 1px; font-family: '7LED', ui-monospace, monospace; font-size: 17px; max-width: 150px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .me .busSign .l1::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(17,17,17,.35) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(17,17,17,.35) 0 1px, transparent 1px 4px); }
    /* 7LED draws each letter as a lit block with the letter cut out, so the orange goes behind the text and the text is black */
    .me .busSign .l1 span { display: inline-block; background: #FFB020; background-clip: content-box; }
    .me .busSign .l1.scroll span { padding-left: 100%; animation: ledScroll var(--dur, 8s) linear infinite; }
    @keyframes ledScroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    .me .busSign .l2 { display: table; margin: 4px auto 0; background: #1B1F27; color: #E9EDF3; border-radius: 999px; padding: 3px 10px;
      font: 700 11px system-ui, sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
    .me .busIcon { display: none; position: absolute; left: 50%; top: 50%; width: 22px; height: 92px; margin: -46px 0 0 -11px;
      transition: transform .8s; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); cursor: pointer; }
    .me.onbus .busIcon { display: block; }
    .me.onbus.bus3d .busIcon { display: none; }   /* zoomed in: the 3D bus is drawn instead */
    .me.onbus .arrow { display: none !important; }
    .me.onbus .face { inset: auto; left: 8px; top: -138px; width: 40px; height: 40px; font-size: 22px; border-width: 2px; }
    .me.onbus .busSign { top: -94px; }
    .me.onbus .np { bottom: 152px; }
    .ontime { color: #3DDC84; } .lateTime { color: #FFB020; } .lateBy { color: #FF4D4D; }
    .me .face { cursor: pointer; }
    /* tap the bus: its journey, train-style */
    #busPanel { display: none; max-height: 52vh; overflow: auto; }
    #busPanel.show { display: block; }
    #busPanel .hd { display: flex; align-items: center; gap: 10px; }
    #busPanel .hd .svc { font-size: 18px; padding: 2px 8px; }
    #busPanel .dest { font-weight: 700; font-size: 16px; flex: 1; }
    #busPanel .x { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
    #busPanel .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    #busPanel .arr { font-weight: 700; margin-top: 4px; }
    #busPanel h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
    #busPanel ol { list-style: none; margin: 0; padding: 0; }
    #busPanel li { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 6px 0 6px 26px; font-size: 14px; }
    #busPanel li::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 3px; background: #FFB020; }
    #busPanel li:first-child::before { top: 50%; } #busPanel li:last-child::before { bottom: 50%; }
    #busPanel li::after { content: ""; position: absolute; left: 3px; top: 50%; width: 9px; height: 9px; margin-top: -6.5px; border-radius: 50%;
      background: #fff; border: 2px solid #FFB020; }
    #busPanel li:first-child, #busPanel li:last-child { font-weight: 700; }
    #busPanel li:first-child::after, #busPanel li:last-child::after { background: #FFB020; }
    #busPanel li .tm { flex: none; font-variant-numeric: tabular-nums; }
    #busPanel li.mine { font-weight: 700; background: rgba(255,176,32,.18); border-radius: 6px; }
    #busPanel li.after { opacity: .5; }
    .flag { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="card">
    <!-- 1. live: when the location last came in, and the speed -->
    <div class="box" id="liveBox"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
    <!-- 2. where they are now (and where they're going) -->
    <div class="box" id="placeBox">
      <div id="where"></div>
      <div id="to"></div>
      <div class="stats" id="stats">
        <div class="stat"><div class="v" id="arrive">--:--</div><div class="l">Arrival</div></div>
        <div class="stat"><div class="v" id="left">--</div><div class="l">Time left</div></div>
        <div class="stat"><div class="v" id="dist">--</div><div class="l">Distance</div></div>
      </div>
      <div id="progress">
        <svg class="flagIc" viewBox="0 0 18 22" aria-label="Start"><line x1="3" y1="2" x2="3" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5c4-1.6 8 1.6 12 .3v8.4c-4 1.4-8-1.8-12-.2Z" fill="#3B9EFF"/></svg>
        <div class="track"><div class="fill"></div>
          <svg class="car" viewBox="0 0 26 16" aria-label="Car"><rect x="1" y="2" width="24" height="12" rx="4" fill="#3B9EFF" stroke="#fff" stroke-width="1.5"/><rect x="14" y="4" width="5" height="8" rx="1.5" fill="#9FD3F5"/><rect x="4" y="4.5" width="4" height="7" rx="1.2" fill="#5E7F96"/><circle cx="23.5" cy="4.5" r="1" fill="#FFF59D"/><circle cx="23.5" cy="11.5" r="1" fill="#FFF59D"/></svg>
        </div>
        <svg class="flagIc" viewBox="0 0 18 22" aria-label="Finish"><defs><pattern id="chq" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#111"/><rect x="2" y="2" width="2" height="2" fill="#111"/></pattern></defs><line x1="3" y1="2" x2="3" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M4 2.5h12.5v8.5H4Z" fill="url(#chq)" stroke="#fff" stroke-width=".8"/></svg>
      </div>
    </div>
    <!-- 3. what they're doing: Driving / Not moving / On the bus / Walking, and what they're listening to -->
    <div class="box" id="doingBox">
      <div id="doing">
        <div id="actIcon"></div>
        <div style="flex:1;min-width:0"><div id="actText">Loading…</div><div id="actSub"><span id="who"></span> <span id="moodTag"></span></div></div>
      </div>
      <div id="song"><span class="tag"></span><span class="st"></span><span class="txt"></span><span class="time"></span></div>
      <div id="songBar"><div></div></div>
    </div>
    <!-- 4. tap the bus: its stops drop down here -->
    <div class="box" id="busPanel"></div>
  </div>

  <button id="busesBtn" title="Live buses on the map" aria-label="Live buses on the map"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="16" height="19" rx="3"/><path d="M6 13h16M10 6h8"/><path d="M9 22v3M19 22v3"/></svg></button>
  <div id="busesTip"></div>
  <button id="follow" class="on" title="Follow">◎</button>
  <div id="brand">Shared from <b>NaviGO</b></div>

  <div id="msg"><div class="box"><div style="font-size:36px" id="msgIcon">🔗</div><h2 id="msgTitle"></h2><p id="msgText"></p></div></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <script src="/config.js"></script>
  <script src="/td-map.js"></script>
  <script>
  'use strict';
  const id = location.pathname.split('/').filter(Boolean)[1];
  const MOODS = { '😀': 'Happy', '😢': 'Sad', '🤩': 'Excited', '😬': 'Nervous', '😠': 'Angry', '😎': "Vibin'",
    '😴': 'Tired', '🥳': 'Celebrating', '🤔': 'Thinking', '😌': 'Chilled', '🤬': 'Raging', '🥶': 'Freezing' };
  const $ = s => document.getElementById(s);

  // The same Mapbox map as the NaviGO app, in Truck Dash colours (td-map.js)
  mapboxgl.accessToken = window.MAPBOX_TOKEN;
  const map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/dark-v11', center: [-2.63, 53.55], zoom: 11,
    dragRotate: false, pitchWithRotate: false });
  map.touchZoomRotate.disableRotation();
  let mapReady = false;
  const emptyLine = () => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } });
  map.on('style.load', () => {
    TDMap.apply(map, true);
    const lbl = (map.getStyle().layers.find(l => l.type === 'symbol') || {}).id;
    const w = k => ['interpolate', ['exponential', 1.5], ['zoom'], 8, 3 * k, 12, 6 * k, 16, 14 * k];
    map.addSource('nv-done', { type: 'geojson', data: emptyLine() });
    map.addSource('nv-todo', { type: 'geojson', data: emptyLine() });
    map.addLayer({ id: 'nv-done', type: 'line', source: 'nv-done', layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#8A94A6', 'line-width': w(1), 'line-opacity': .6 } }, lbl);
    map.addLayer({ id: 'nv-todo-case', type: 'line', source: 'nv-todo', layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0D0F12', 'line-width': w(1.45) } }, lbl);
    map.addLayer({ id: 'nv-todo', type: 'line', source: 'nv-todo', layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#3B9EFF', 'line-width': w(1) } }, lbl);
    mapReady = true; routeV = -1;
    if (data) { drawRoute(data); drawMe(data); }
  });
  const flagSvg = '<svg viewBox="0 0 34 44" width="34" height="44"><ellipse cx="7" cy="42" rx="5" ry="2" fill="rgba(0,0,0,.4)"/><line x1="7" y1="4" x2="7" y2="42" stroke="#0D0F12" stroke-width="5" stroke-linecap="round"/><line x1="7" y1="4" x2="7" y2="42" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M8 4c8-3 16 4 24 1v16c-8 3-16-4-24-1Z" fill="#FF4D4D" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>';

  let follow = true, first = true, wasEnded = false, data = null, routeV = -1, photoV = -1;
  let routePts = [], me = null, flag = null;

  $('follow').onclick = () => { follow = !follow; $('follow').classList.toggle('on', follow); if (follow) centre(true); };
  map.on('dragstart', () => { follow = false; $('follow').classList.remove('on'); });

  const pad2 = n => String(n).padStart(2, '0');
  const escH = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const clock = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const dur = s => { const m = Math.max(0, Math.round(s / 60)); return m >= 60 ? Math.floor(m / 60) + ' h ' + pad2(m % 60) : m + ' min'; };
  const miles = m => (m / 1609.344 < 10 ? (m / 1609.344).toFixed(1) : Math.round(m / 1609.344)) + ' mi';
  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 10) return 'just now';
    if (s < 60) return s + ' seconds ago';
    const m = Math.round(s / 60);
    if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    const h = Math.round(m / 60); return h + (h === 1 ? ' hour ago' : ' hours ago');
  }
  function sq(a, b) { const k = Math.cos(a[0] * Math.PI / 180); return (a[0] - b[0]) ** 2 + ((a[1] - b[1]) * k) ** 2; }

    // zoomed right out: only about 80 km round the middle of the screen (the whole country is too much)
    const b = map.getBounds(), c = map.getCenter(), hl = 0.36, hw = 0.36 / Math.cos(c.lat * Math.PI / 180);
    const s = Math.max(b.getSouth(), c.lat - hl), n = Math.min(b.getNorth(), c.lat + hl), w = Math.max(b.getWest(), c.lng - hw), e = Math.min(b.getEast(), c.lng + hw);
    const q = 's=' + s.toFixed(4) + '&w=' + w.toFixed(4) + '&n=' + n.toFixed(4) + '&e=' + e.toFixed(4);
    try {
      const r = await fetch('/api/buses?' + q, { cache: 'no-store' });
      if (!r.ok) return;
      const list = (await r.json()).sort((a, b) => metres([c.lng, c.lat], [a.lng, a.lat]) - metres([c.lng, c.lat], [b.lng, b.lat])).slice(0, 400);
      if (!busesOn) return;
      const z = map.getZoom(), size = z >= 16 ? 1.5 : z >= 15 ? 1.25 : z >= 14 ? 1.05 : z >= 12 ? 0.8 : z >= 10 ? 0.6 : 0.45, showNum = z >= 11;
      const lines = z >= 13 ? roadLines() : [];
      const now = performance.now(), seen = new Set();
      list.forEach(v => {
        const id = v.id || (v.line + v.dest); seen.add(id);
        const raw = [v.lng, v.lat];
        let o = buses.get(id);
        let heading = o && o.raw && metres(o.raw, raw) > 8 ? bearing(o.raw, raw) : (o && o.heading != null ? o.heading : v.heading);
        let pos = raw;
        const sn = snap(raw, lines);
        if (sn) { pos = sn.p; heading = heading == null ? sn.road : (Math.abs(angDiff(sn.road, heading)) <= 90 ? sn.road : (sn.road + 180) % 360); }
        if (!o) {
          const el = document.createElement('div'); el.className = 'lbus';
          el.innerHTML = miniBus + '<b></b>';
          el.addEventListener('click', ev => { ev.stopPropagation(); tip(el.title); });
          o = { el, svg: el.querySelector('img'), m: new mapboxgl.Marker({ element: el }).setLngLat(pos).addTo(map), from: pos, to: pos, t0: now };
          buses.set(id, o);
        } else {
          const cur = o.m.getLngLat().toArray();
          if (metres(cur, pos) > 1500) { o.from = o.to = pos; o.m.setLngLat(pos); } else { o.from = cur; o.to = pos; o.t0 = now; }
        }
        o.raw = raw; o.heading = heading;
        o.el.querySelector('b').textContent = showNum ? v.line : '';
        o.el.title = 'Bus ' + v.line + (v.dest ? ' to ' + v.dest : '');
        o.svg.style.transform = 'rotate(' + (heading || 0) + 'deg) scale(' + size + ')';
        o.el.style.setProperty('--lift', Math.round(18 * size + 3) + 'px');   // number sits just above the bus whichever way it faces
        o.line = v.line;
      });
      declutter(true);
      buses.forEach((o, id) => { if (!seen.has(id)) { o.m.remove(); buses.delete(id); } });
      hideMyBusTwin();
    } catch (e) { /* try again next time */ }
  }
  // On the bus: the moving bus is you, so hide the same bus from the live-bus layer (your marker is it)
  function myRide() { return data && data.mode === 'bus' && data.bus && data.bus.riding && data.lat != null && !data.endedAt ? data : null; }
  function hideMyBusTwin() {
    const r = myRide(); let twin = null, best = 120;
    if (r) buses.forEach((o, id) => {
      const d = metres(o.m.getLngLat().toArray(), [r.lng, r.lat]);
      if (o.line === r.bus.service && d < best) { best = d; twin = id; }
    });
    buses.forEach((o, id) => { o.el.style.display = id === twin ? 'none' : ''; o.twin = id === twin; });
  }
  // 3D buses (Nick's Arriva bus) when zoomed in
  const BUS3D_ZOOM = 14;
  function add3dBuses() {
    try {
      if (!map.hasModel || !map.hasModel('arriva-bus')) map.addModel('arriva-bus', location.origin + '/arriva_bus.glb');
      if (!map.getSource('live-bus-3d')) map.addSource('live-bus-3d', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      if (!map.getLayer('live-bus-3d')) map.addLayer({ id: 'live-bus-3d', type: 'model', source: 'live-bus-3d', minzoom: BUS3D_ZOOM,
        layout: { 'model-id': 'arriva-bus' },
        paint: { 'model-type': 'common-3d', 'model-rotation': ['get', 'rot'],
          'model-scale': ['interpolate', ['linear'], ['zoom'], 14, ['literal', [7, 7, 7]], 17, ['literal', [2.2, 2.2, 2.2]], 20, ['literal', [1.2, 1.2, 1.2]]] } });
    } catch (e) { console.log('3D buses not available', e); }
  }
  map.on('style.load', add3dBuses);
  let last3d = 0;
  function update3d(now) {
    if (now - last3d < 150 || !map.getSource) return; last3d = now;
    const src = map.getSource('live-bus-3d'); if (!src || !src.setData) return;
    const on = map.getZoom() >= BUS3D_ZOOM, feats = [];
    if (on) {
      // other buses stay as flat top-down icons with their number (the 3D ones drifted off their spot and hid the numbers)
      const r = myRide(); if (r && me) feats.push({ type: 'Feature', properties: { rot: [0, 0, (r.heading || 0) - 90] }, geometry: { type: 'Point', coordinates: me.getLngLat().toArray() } });
    }
    const meEl = me && me.getElement().querySelector('.me'); if (meEl) meEl.classList.toggle('bus3d', on && !!myRide());
    src.setData({ type: 'FeatureCollection', features: feats });
  }
  // Buses close together (two at the same stop): stack their numbers so they don't sit on top of each other
  let lastDeclutter = 0;
  function declutter(force) {
    const now = performance.now();
    if (!force && now - lastDeclutter < 300) return; lastDeclutter = now;
    const items = [];
    buses.forEach(o => {
      if (o.twin || !o.el.querySelector('b').textContent) { o.el.style.setProperty('--dy', '0px'); return; }
      const pt = map.project(o.m.getLngLat()); const lift = parseFloat(o.el.style.getPropertyValue('--lift')) || 22;
      items.push({ o, x: pt.x, y: pt.y - lift });
    });
    items.sort((a, b) => b.y - a.y);
    const placed = [];
    items.forEach(it => {
      let dy = 0;
      for (let k = 0; k < 5; k++) {
        const y = it.y + dy;
        if (!placed.some(p => Math.abs(p.x - it.x) < 30 && Math.abs(p.y - y) < 15)) break;
        dy -= 15;
      }
      placed.push({ x: it.x, y: it.y + dy });
      it.o.el.style.setProperty('--dy', dy + 'px');
    });
  }
  (function glide() {
    const now = performance.now();
    update3d(now); declutter(false);
    buses.forEach(o => {
      if (o.from === o.to) return;
      const t = Math.min(1, (now - o.t0) / BUS_POLL);
      o.m.setLngLat([o.from[0] + (o.to[0] - o.from[0]) * t, o.from[1] + (o.to[1] - o.from[1]) * t]);
      if (t >= 1) o.from = o.to;
    });
    requestAnimationFrame(glide);
  })();
  $('busesBtn').classList.toggle('on', busesOn);
  $('busesBtn').onclick = () => {
    busesOn = !busesOn;
    try { localStorage.setItem('navigoBuses', busesOn ? 'on' : 'off'); } catch (e) {}
    $('busesBtn').classList.toggle('on', busesOn);
    tip(busesOn ? 'Live buses on' : 'Live buses off');
    loadBuses();
  };
  map.on('moveend', () => { if (busesOn) { clearTimeout(loadBuses.d); loadBuses.d = setTimeout(loadBuses, 600); } });
  setTimeout(loadBuses, 3000);

  setInterval(render, 1000);   // keep "updated x seconds ago" ticking
  if (!/^[A-Za-z0-9]{8,16}$/.test(id || '')) showMsg('🔗', 'Bad link', 'This trip link is not complete.');
  else poll();
  </script>
</body>
